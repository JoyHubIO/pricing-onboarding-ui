# Builds the pricing page and publishes dist/ to GitHub Pages, at
# https://<owner>.github.io/<repo>/ . Deploys from the ticket branch named below;
# change `branches` when the next ticket's branch should be the one on show.
name: Pages

on:
  push:
    branches: [wip/t1-pricing-page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      # Pages serves a project site under /<repo>/, so assets are referenced from there.
      - run: npx vite build --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
