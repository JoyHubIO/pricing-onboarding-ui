# Builds the pricing page and publishes dist/ to GitHub Pages, at
# https://<owner>.github.io/<repo>/ . Deploys from main: merge the ticket branch
# that should be on show into main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      # Pages serves a project site under /<repo>/, so assets are referenced from there.
      # The pricing API the published page reads. Set the repository variable
      # PRICING_API_URL; that API must list this site's origin in
      # pricingAllowedOrigins. Unset, the page says it cannot load pricing.
      - run: npx vite build --base "/${{ github.event.repository.name }}/"
        env:
          VITE_SCALA_API_URL: ${{ vars.PRICING_API_URL }}
          VITE_TEST_ROUTES: ${{ vars.PRICING_TEST_ROUTES }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
